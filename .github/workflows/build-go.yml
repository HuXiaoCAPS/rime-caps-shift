name: Build Go Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'go-version/**'                # 仅当 go-version 目录下文件变动时触发
      - '.github/workflows/build-go.yml' # 或工作流文件自身变动时
  pull_request:
    branches: [ main, master ]
    paths:
      - 'go-version/**'
      - '.github/workflows/build-go.yml'

jobs:
  build-go:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./go-version  # 所有后续 run 命令都在此目录执行

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          # 用已提交的 go.mod 作为缓存键；go.sum 由 go mod tidy 生成/校验。
          cache-dependency-path: go-version/go.mod

      - name: Build
        run: |
          go mod tidy
          go build -ldflags="-s -w -H windowsgui" -o RimeCapsShift-Go.exe .
        env:
          CGO_ENABLED: 0

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimeCapsShift-Go-windows-exe
          path: go-version/RimeCapsShift-Go.exe
          if-no-files-found: error
          retention-days: 30
