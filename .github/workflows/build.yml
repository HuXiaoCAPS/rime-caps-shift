name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Nuitka standalone (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@v1.5
        with:
          # Pin both the action and compiler for reproducible builds.
          nuitka-version: "4.3.4"
          script-name: rime_caps_shift.py
          mode: standalone
          python-flag: "no_site"
          windows-console-mode: disable
          output-dir: build
          windows-icon-from-ico: assets/rime_caps_shift.ico
          assume-yes-for-downloads: true
          nofollow-import-to: |
            tkinter
            unittest
            pydoc
            doctest
            test
            tests
            distutils
            setuptools
            pip
            ensurepip
            venv
            lib2to3
            idlelib
            turtle
            curses
            sqlite3
            multiprocessing
            asyncio
            concurrent
            socket
            ssl
            http
            urllib
            email
            xml
            html
            json
            pickle
            shelve
            dbm
            gzip
            bz2
            lzma
            tarfile
            zipfile
            csv
            configparser
            ftplib
            smtplib
            imaplib
            poplib
            telnetlib
            xmlrpc
            wsgiref
            pdb
            profile
            cProfile
            pstats
            timeit
            trace

      - name: Package standalone build
        shell: pwsh
        run: |
          $dist = Get-ChildItem -LiteralPath "build" -Directory -Filter "*.dist" |
            Select-Object -First 1
          if (-not $dist) {
            throw "Nuitka standalone output directory was not created"
          }
          $target = Join-Path "build" "RimeCapsShift.dist"
          Rename-Item -LiteralPath $dist.FullName -NewName "RimeCapsShift.dist"
          $exe = Get-ChildItem -LiteralPath $target -Filter "*.exe" |
            Select-Object -First 1
          if (-not $exe) {
            throw "No executable found in $target"
          }
          Rename-Item -LiteralPath $exe.FullName -NewName "RimeCapsShift.exe"
          Copy-Item -LiteralPath "README.md" -Destination (Join-Path $target "README.md")
          $zip = "build\RimeCapsShift-windows-x64.zip"
          Compress-Archive -Path (Join-Path $target "*") `
            -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  RimeCapsShift-windows-x64.zip" |
            Set-Content -LiteralPath "build\RimeCapsShift-windows-x64.zip.sha256" `
              -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: RimeCapsShift-windows-x64-standalone
          path: |
            build/RimeCapsShift-windows-x64.zip
            build/RimeCapsShift-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "build\RimeCapsShift-windows-x64.zip"
          $sum = "build\RimeCapsShift-windows-x64.zip.sha256"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $sum --clobber
          } else {
            gh release create $tag $zip $sum --verify-tag `
              --title "RimeCapsShift $tag" --generate-notes
          }
